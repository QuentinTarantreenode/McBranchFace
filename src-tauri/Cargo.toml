[package]
name = "mcbranchface"
version = "1.3.0"
description = "A Git client for many repos, worktrees and agents, with safe branch cleanup"
authors = ["McBranchFace contributors"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcbranchface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "macros", "sync", "time", "io-util"] }
futures = "0.3.34"
anyhow = "1.0.104"
dirs = "7.0.0"
tauri-plugin-dialog = "2.7.3"
notify = "8.2.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
# Already part of the build through Tauri: the window subclass for presses on the title bar, and job
# objects so a timeout or cancel ends a child together with the programs it started.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dev-dependencies]
# Test binaries read a fixed git config before any test runs (src/test_env.rs).
ctor = "0.8.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
