# Builds one artifact set per operating system; every platform only contains its own binaries.
# scripts/release.mjs creates the tag after all gates and the Windows build passed locally. A pushed `v*` tag
# builds every platform and attaches the installers to a draft release, which is published by hand after a look.
# Started by hand (Actions → Run workflow) it only builds and keeps the installers as run artifacts.
# Actions are pinned to commits; the release is made with the gh CLI that the runners carry.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "McBranchFace ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md for what changed."

  build:
    needs: create-release
    # A manual run has no release to wait for: the job is skipped there, and this still lets the build go on.
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            args: --bundles nsis,msi
          - name: macos-arm64
            runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_target: x86_64-apple-darwin
          - name: linux-x64
            runner: ubuntu-22.04
            args: --bundles appimage,deb
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Toolchain and components as rust-toolchain.toml names them, plus the cross target.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.rust_target }}" ]; then rustup target add "${{ matrix.rust_target }}"; fi

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Gates
        run: node scripts/verify.mjs --quick

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      # Executable and installer are only measured where the budgets were set.
      - name: Size budgets
        if: matrix.name == 'windows-x64'
        run: node scripts/budgets.mjs --release

      - name: Artifact sizes
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '| File | Size |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target -path '*release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec sh -c 'printf "| %s | %s KB |\n" "$(basename "$1")" "$(( $(wc -c < "$1") / 1024 ))"' _ {} \; >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcbranchface-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/target -path '*release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
